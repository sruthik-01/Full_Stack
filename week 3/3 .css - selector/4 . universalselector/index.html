<!-- Group Selector selects multiple elements at the same time. -->

<!DOCTYPE html>
<html>

<head>
    <title>Group Selector Example</title>

    <style>
        h1, h2, p {
            color: purple;
            font-size: 30px;
        }
    </style>

</head>

<body>

    <h1>My Website</h1>

    <p>Welcome to my webpage.</p>

    <h2>Learning CSS Selectors</h2>

</body>

</html>
