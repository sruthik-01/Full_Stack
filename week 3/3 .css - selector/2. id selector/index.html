<!-- ID Selector selects one unique element using its id. -->

<!DOCTYPE html>
<html>

<head>
    <title>ID Selector Example</title>

    <link rel="stylesheet" href="style.css">

    <style>
        p {
            font-size: 30px;
        }
    </style>
</head>

<body>

    <h1 id="heading">My CSS Website</h1>

    <p id="hp">This is an ID selector example.</p>

</body>

</html>
