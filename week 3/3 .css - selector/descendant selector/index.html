<!-- Descendant Selector selects elements inside another element. -->

<!DOCTYPE html>
<html>

<head>
    <title>Descendant Selector Example</title>

    <style>
        section p {
            color: blue;
            font-size: 40px;
        }
    </style>

</head>

<body>

    <section>
        <p>This paragraph is inside the section.</p>
    </section>

    <p>This paragraph is outside the section.</p>

</body>

</html>
