<!-- Class Selector selects elements with the same class. -->

<!DOCTYPE html>
<html>

<head>
    <title>Class Selector Example</title>

    <style>
        .heading {
            color: blue;
            font-size: 40px;
        }

        .paragraph {
            color: green;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <h1 class="heading">My Website</h1>

    <p class="paragraph">This is a class selector example.</p>

</body>

</html>
