<!-- Element Selector selects all elements of a specific HTML tag. -->

<!DOCTYPE html>
<html>

<head>
    <style>
        h1 {
            color: purple;
        }

        p {
            color: orange;
        }
    </style>
</head>

<body>

    <h1>My Website</h1>

    <p>This is an example of Element Selector.</p>

</body>

</html>
