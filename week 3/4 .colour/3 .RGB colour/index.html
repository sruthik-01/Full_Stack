<!-- RGB stands for Red, Green, Blue. -->

<!DOCTYPE html>
<html>

<head>
    <title>RGB Color Example</title>

    <style>
        h1 {
            color: rgb(255, 99, 71);
        }

        p {
            color: rgb(34, 139, 34);
        }
    </style>

</head>

<body>

<h1>Welcome to My Website</h1>

<p>Learning RGB Colors in CSS</p>

</body>

</html>
