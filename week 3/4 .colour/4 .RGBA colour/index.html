<!-- RGBA adds Alpha (Transparency). -->

<!DOCTYPE html>
<html>

<head>
    <title>RGBA Color Example</title>

    <style>
        h1 {
            color: rgba(255, 0, 0, 0.5);
            font-size: 50px;
        }

        p {
            color: rgba(0, 128, 0, 0.8);
        }
    </style>

</head>

<body>

<h1>Welcome to My Website</h1>

<p>Learning RGBA Colors in CSS</p>

</body>

</html>
