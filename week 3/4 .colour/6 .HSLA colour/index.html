<!-- HSLA is HSL with transparency. -->

<!DOCTYPE html>
<html>

<head>
    <title>HSLA Color Example</title>

    <style>
        h1 {
            color: hsla(120, 60%, 40%, 0.5);
        }

        p {
            color: hsla(240, 70%, 50%, 0.8);
        }
    </style>

</head>

<body>

<h1>Welcome to My Website</h1>

<p>Learning HSLA Colors in CSS</p>

</body>

</html>
