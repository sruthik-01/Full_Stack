<!-- You can use predefined color names in CSS. -->

<!DOCTYPE html>
<html>

<head>
    <title>Color Name Example</title>

    <style>
        h1 {
            color: green;
        }

        p {
            color: orange;
        }
    </style>

</head>

<body>

    <h1>Welcome to My Website</h1>

    <p>Learning Colors in CSS</p>

</body>

</html>
