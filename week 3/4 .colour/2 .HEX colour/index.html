<!-- HEX colors start with # followed by six hexadecimal digits. -->

<!DOCTYPE html>
<html>

<head>
    <title>HEX Color Example</title>

    <style>
        h1 {
            color: #FF5733;
        }

        p {
            color: #2E8B57;
        }
    </style>

</head>

<body>

    <h1>Welcome to My Website</h1>

    <p>Learning HEX Colors in CSS</p>

</body>

</html>
