<!-- HSL stands for Hue, Saturation, Lightness. -->

<!DOCTYPE html>
<html>

<head>
    <title>HSL Color Example</title>

    <style>
        h1 {
            color: hsl(120, 60%, 40%);
            font-size: 50px;
        }

        p {
            color: hsl(240, 70%, 50%);
        }
    </style>

</head>

<body>

<h1>Welcome to My Website</h1>

<p>Learning HSL Colors in CSS</p>

</body>

</html>
